# Mnelo Development — local CLI configuration only. Never use test OTP in cloud Auth.
project_id = "mnelo-local"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"
[db.migrations]
enabled = true
[db.seed]
enabled = false
sql_paths = ["./seed.sql"]
[realtime]
enabled = true
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = true
file_size_limit = "20MiB"
[storage.s3_protocol]
enabled = false
[storage.analytics]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:8082"
additional_redirect_urls = ["mnelo://auth/callback"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.rate_limit]
email_sent = 2
sms_sent = 10
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 20
token_verifications = 10
[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 300
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Mnelo code is {{ .Code }}"
max_frequency = "60s"
# Reserved development fixtures; no SMS provider enabled and no real SMS is sent.
[auth.sms.test_otp]
15555550101 = "123456"
15555550102 = "234567"
15555550103 = "345678"
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2
[analytics]
enabled = false
# CLI requires a provider configuration to keep phone login enabled. These deliberately invalid,
# non-secret placeholder values cannot send SMS; the fail-closed hook replaces provider delivery.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "local-placeholder-not-a-credential"
[auth.hook.send_sms]
enabled = true
uri = "pg-functions://postgres/private/reject_unconfigured_sms"

[functions.avatar]
# Modern signing keys are validated with Auth.getUser inside the function.
verify_jwt = false

[functions.chat-upload]
verify_jwt = false

[functions.chat-forward]
verify_jwt = false

[functions.connect-intent]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.calls]
verify_jwt = false

[functions.call-cleanup]
verify_jwt = false

[functions.account-deletion]
verify_jwt = false

[functions.account-cleanup]
verify_jwt = false
